# Flatpak bundle of the release binaries. Nothing is compiled here: the
# module repackages the Linux tarball that `cargo xtask package --format
# tar.gz` makes (the [profile.dist] `glyphvane` and `glyphvane-helper`, the
# PDF and emoji fonts, the desktop file, the AppStream metadata and the
# icons) into /app with the deb's layout, so the programs find the helper
# and the fonts at the same relative paths.
#
# Build (the release workflow does this):
#   cp dist/glyphvane-<version>-<triple>.tar.gz packaging/flatpak/glyphvane.tar.gz
#   flatpak-builder --user --install-deps-from=flathub --repo=repo \
#     build-dir packaging/flatpak/io.github.sorrelfox.Glyphvane.yml
#   flatpak build-sign --gpg-sign=<key> repo io.github.sorrelfox.Glyphvane
#   flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
#     --repo-url=https://sorrelfox.github.io/glyphvane/repo/ \
#     --gpg-keys=packaging/flatpak/glyphvane-repo.gpg \
#     repo Glyphvane-<version>-<arch>.flatpak io.github.sorrelfox.Glyphvane
#
# The release bundles are also published as a signed Flatpak repository on
# GitHub Pages (make-repo.sh, .github/workflows/flatpak-repo.yml).
#
# The app recognises the sandbox by /.flatpak-info: it turns the update
# check off (Flatpak updates it) and keeps the single-instance socket in
# $XDG_RUNTIME_DIR/app/io.github.sorrelfox.Glyphvane/, which every
# instance of the app shares.

app-id: io.github.sorrelfox.Glyphvane
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: glyphvane
# flatpak-builder composes the AppStream catalogue (share/app-info) from the
# metainfo, desktop file and icons. The bundle carries it in its header and
# the repository's appstream branch is made from it: software centres show
# the name, summary, licence, links, screenshots and icon from it.

finish-args:
  # Windows: Wayland, with X11 where there is no Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU rendering (wgpu / Vulkan).
  - --device=dri
  # Audio embeds: cpal opens ALSA's default device, which the runtime
  # routes to PulseAudio (or PipeWire's PulseAudio server).
  - --socket=pulseaudio
  # Remote images in notes. The update check is off in the Flatpak.
  - --share=network
  # Links between notes may leave the opened vault, so the home folder
  # rather than portal-only access (the metainfo description explains each
  # permission to users). File dialogs, printing, opening
  # links and files, notifications and the colour scheme go through the
  # desktop portals, which need no permission here.
  - --filesystem=home

modules:
  - name: glyphvane
    buildsystem: simple
    build-commands:
      - install -Dm755 glyphvane /app/bin/glyphvane
      - install -Dm755 glyphvane-helper /app/libexec/glyphvane/glyphvane-helper
      - mkdir -p /app/share
      - cp -r share/applications share/metainfo share/icons share/glyphvane /app/share/
      - install -Dm644 -t /app/share/licenses/io.github.sorrelfox.Glyphvane LICENSE THIRD-PARTY-NOTICES.txt
    sources:
      # The release tarball for this architecture, copied here under a
      # fixed name before the build. Its top folder is stripped.
      - type: archive
        path: glyphvane.tar.gz
