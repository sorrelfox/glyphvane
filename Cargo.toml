[workspace]
resolver = "3"
members = [
  "crates/*",
  "xtask",
  # Vendored Zed code (see third_party/zed/PROVENANCE.md).
  "third_party/zed/rope",
  "third_party/zed/test-shims/*",
]
# Patched crates (see [patch.crates-io] below) are not members: they keep
# their upstream lints and formatting.
exclude = ["third_party/zed/gpui-pre-wgpu"]
default-members = ["crates/*"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/sorrelfox/glyphvane"

[workspace.dependencies]
# Internal crates
gv-text = { path = "crates/gv-text" }
gv-syntax = { path = "crates/gv-syntax" }
gv-model = { path = "crates/gv-model" }
gv-vault = { path = "crates/gv-vault" }
gv-search = { path = "crates/gv-search" }
gv-render-tree = { path = "crates/gv-render-tree" }
gv-html = { path = "crates/gv-html" }
gv-highlight = { path = "crates/gv-highlight" }
gv-math = { path = "crates/gv-math" }
gv-diagram = { path = "crates/gv-diagram" }
gv-media = { path = "crates/gv-media" }
gv-bases = { path = "crates/gv-bases" }
gv-canvas = { path = "crates/gv-canvas" }
gv-export = { path = "crates/gv-export" }
gv-editor = { path = "crates/gv-editor" }
gv-spell = { path = "crates/gv-spell" }
gv-ui = { path = "crates/gv-ui" }
gv-helper = { path = "crates/gv-helper", default-features = false }
gv-settings = { path = "crates/gv-settings" }
gv-inline = { path = "crates/gv-inline" }
gv-profile = { path = "crates/gv-profile" }
# Zed's rope, vendored unmodified (ADR-015; third_party/zed/PROVENANCE.md).
rope = { path = "third_party/zed/rope" }

# Third-party crates: add shared versions here and use `{ workspace = true }` in crates.
anyhow = "1.0.100"
clap = { version = "4.6", features = ["derive"] }
# GPUI through the GPUI Kit facade (ADR-013, option A). The kit pins the matching
# `gpui-pre` snapshot exactly, so bump the two together by bumping this pin.
gpui = { package = "gpui-kit", version = "=0.9.1" }
# The GPUI snapshot the kit pins, named only so tests can switch on its
# `test-support` feature (renamed so its `gpui` library does not clash with the
# kit). The kit's own `test-support` feature does not resolve:
# it names the kit's optional `gpui-fast` backend, whose exact `taffy` pin
# conflicts with this snapshot's.
gpui-pre = { package = "gpui-pre", version = "=0.3.12" }
serde = { version = "1.0.219", features = ["derive"] }
# Zed crates published with the GPUI snapshot. Keep these pins equal to the
# `gpui-pre` pin above: the vendored rope is synced to the same Zed commit.
sum_tree = { package = "gpui-pre-sum-tree", version = "=0.3.12" }
gpui_util = { package = "gpui-pre-util", version = "=0.3.12" }
ztracing = { package = "gpui-pre-ztracing", version = "=0.3.12" }
# Text: the vendored rope's dependencies, and encodings (gv-text).
chardetng = "1.0.0"
encoding_rs = "0.8.44"
heapless = "0.9.2"
memchr = "2.7"
log = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1.8"
simdutf8 = "0.1.5"
unicode-segmentation = "1.10"
# East Asian and emoji display widths (gv-editor: table formatting).
unicode-width = "0.2.3"
# Tests and benchmarks.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
ctor = "1.0.12"
# Instruction-count benchmarks (Valgrind/Callgrind; Linux CI gate). The
# library must match the `gungraun-runner` binary exactly, so this is an
# exact pin; bump both together (`cargo xtask bench-icount` prints the
# install command). Apache-2.0 OR MIT.
gungraun = "=0.20.0"
proptest = "1.12.0"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
toml = "1.2"
# Logging (tracing). `tracing-log` forwards the `log` records of GPUI and wgpu.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "std",
  "tracing-log",
] }
# Conformance tooling: the comrak differential oracle (dev-only, exact pin so
# recorded divergences stay valid; bump deliberately) and spec fixtures.
comrak = { version = "=0.59.0", default-features = false }
serde_json = "1.0.145"
# Vault: path index and link resolver (gv-vault). Unicode caseless matching
# (full case folding, Unicode 16) and normalization for path keys, the
# parallel directory walk, WHATWG URL parsing for the URL classifier, and
# lock-free snapshot publication.
arc-swap = "1.9.5"
caseless = "0.2.2"
# Vault: Git awareness (branch, file status). Pure Rust; only the status
# machinery, no network, no parallel threads (MIT OR Apache-2.0).
gix = { version = "0.90.0", default-features = false, features = ["status", "sha1"] }
ignore = "0.4.34"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"
url = "2.5.8"
# Settings (gv-settings): format-preserving TOML edits, typed errors and the
# per-OS config, data and cache directories.
directories = "6.0.0"
thiserror = "2.0.21"
toml_edit = "0.25.19"
# App: the settings file watcher (debounced; re-exports `notify`) and the
# channel that hands reloaded settings to the UI thread.
futures = "0.3.34"
notify-debouncer-full = "0.7.0"
# App: single instance. `rustix` gives the user id and the Unix socket's peer
# credentials without `unsafe`; `interprocess` is the Windows named pipe.
interprocess = { version = "2.4.6", default-features = false }
rustix = { version = "1.1.6", features = ["net", "process"] }
# App: the native message box shown when the GPU cannot be used (Windows
# `MessageBoxW`, macOS `NSAlert`). Default features only add Linux backends,
# which use zenity and kdialog directly instead.
rfd = { version = "0.17.2", default-features = false }
# Settings and save pipeline (gv-settings): `ReplaceFileW` for atomic saves on
# Windows. The version the tree already has (tempfile, rustix and others use
# it; MIT OR Apache-2.0).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# App (Linux): presentation feedback for the opt-in keystroke latency log
# (`GLYPHVANE_DEBUG_LATENCY`), on GPUI's Wayland connection through
# libwayland. The versions GPUI already pulls in (MIT).
raw-window-handle = "0.6.2"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
# Model (gv-model): Unicode general categories for the heading slug
# algorithms (letters, marks, numbers, connector punctuation).
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
# Render tree (gv-render-tree): find in page with regular expressions
# (MIT OR Apache-2.0).
regex = "1.13.1"
# Inline layout (gv-inline): UAX #14 line breaking. Grapheme clusters come
# from `unicode-segmentation` above.
unicode-linebreak = "0.1.5"
# Editor (gv-editor): the test-only stand-in for Zed's `util` crate
# (`RandomCharIter`), used by the tests ported with the tab map
# (third_party/zed/PROVENANCE.md). Its library is named `util`.
zed-test-util = { path = "third_party/zed/test-shims/util" }
# Save pipeline (gv-vault `files`): SHA-256 content hashes for change
# detection and journal bases, CRC-32 checksums on journal records, and the
# line diff behind reloads and 3-way merges (the `similar` version GPUI
# already pulls in; Apache-2.0).
crc32fast = "1.5.5"
sha2 = "0.10.9"
similar = "2.7.0"
# File operations (gv-vault `refactor`): Delete moves files to the OS
# trash: the freedesktop trash on Linux and the BSDs, NSFileManager on
# macOS, the shell's recycle bin on Windows (MIT; checked 2026-11-17).
trash = "5.3.0"
# UI (gv-ui): fuzzy matching for the command palette, from the nucleo
# project (MPL-2.0).
nucleo-matcher = "0.3.1"
# HTML (gv-html): the HTML5 parser, building into gv-html's own tree sink
# (MIT OR Apache-2.0). The WHATWG URL parser above resolves pasted links.
html5ever = "0.40.1"
# Export (gv-export): the sanitizer of exported HTML and copied rich text,
# configured with the native walker's allowlist and URL classifier. Pinned:
# take its security releases promptly (MIT OR Apache-2.0; it pulls in
# cssparser, MPL-2.0).
ammonia = "=4.2.5"
# Math (gv-math): RaTeX, LaTeX parsing and layout to a display list
# (MIT; its mhchem part derives from KaTeX's Apache-2.0 mhchem, credited in
# the notices), the KaTeX fonts it bundles (OFL-1.1) and the font reader
# that draws their glyph outlines (skrifa, the version GPUI's text stack
# already pulls in; MIT OR Apache-2.0). RaTeX has one maintainer and releases often: exact pins, bump
# together after the math golden tests pass. Never add `ratex-font-loader`
# or `ratex-unicode-font` (they scan system fonts and log to stderr).
ratex-katex-fonts = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-types = "=0.1.15"
skrifa = "0.44.0"
# Math golden tests: CPU rasterizer (the version GPUI already pulls in;
# BSD-3-Clause).
tiny-skia = "0.11.4"
# App (gv-app, Linux): the font database GPUI's text stack already uses
# (same version and default features; MIT), to find the installed colour
# emoji font and decide whether the bundled one is needed (R-22).
fontdb = "0.23.0"
# App (gv-app): the clipboard's HTML flavor for smart paste, which GPUI's
# clipboard does not carry (MIT OR Apache-2.0). Without the default
# `image-data` feature: no image decoder. gv-app adds Wayland data-control.
arboard = { version = "3.7.0", default-features = false }
# Code highlighting (gv-highlight): TextMate grammars through giallo, pure
# Rust (fancy-regex) without its `dump` feature, which would add zstd's C
# code; grammars come from our own bundle instead. EUPL-1.2, allowed for this
# crate only (deny.toml, ADR-016). One maintainer and frequent breaking
# releases: exact pin, bump deliberately after the gv-highlight tests pass.
giallo = { version = "=0.6.0", default-features = false }
# The bundle's raw-deflate decoder (the version flate2 already pulls in; MIT
# OR Zlib OR Apache-2.0).
miniz_oxide = "0.9.1"
# Diagrams (gv-diagram): Mermaid through merman, a headless Rust port of
# Mermaid 12 (MIT OR Apache-2.0), WITHOUT ELK (ADR-017): never enable its
# default features, `layout-elk` or `complete-svg-elk` (merman-elk-layered is
# EPL-2.0 only; deny.toml rejects it). `native-fonts` measures labels with
# the font that paints them. One very active maintainer: exact pin, bump
# after the gv-diagram golden tests pass.
merman = { version = "=0.10.0", default-features = false, features = [
  "all-diagrams",
  "svg",
  "layout-cytoscape",
  "native-fonts",
] }
# SVG to vector tree (gv-diagram: merman's SVG to our display list) and the
# SVG rasterizer (gv-media). The 0.47 line merman's font context already
# pulls in, so the tree has one usvg next to GPUI's own (MIT OR Apache-2.0).
# No system-font scanning: callers hand in a font database.
usvg = { version = "0.47.0", default-features = false, features = ["text"] }
resvg = { version = "0.47.0", default-features = false, features = ["text", "raster-images"] }
# Images (gv-media, ADR-019): pure-Rust decoders through `image` (MIT OR
# Apache-2.0), only the formats the plan lists; no rayon, no AVIF (that goes
# through the helper), no TIFF unless gv-media's `tiff` feature is on.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# ICC to sRGB (gv-media): the moxcms version `image` already uses
# (BSD-3-Clause OR Apache-2.0).
moxcms = "0.8.1"
# Downscaling decoded images to display size (gv-media): pure Rust with SIMD
# paths, alpha-correct (MIT OR Apache-2.0). Only the RGBA8 pixel type is
# compiled in.
fast_image_resize = { version = "6.1.0", default-features = false, features = ["std", "only_u8x4"] }
# gv-media tests: writing APNG test files (the png version `image` already
# uses; MIT OR Apache-2.0).
png = "0.18.1"
# Audio (gv-media `audio`, ADR-019): symphonia decodes (MPL-2.0), only
# the codecs and containers FR-RENDER-07 lists, with the ID3 and APE tag
# readers so tagged MP3s probe; no SIMD feature (it pulls in rustfft). Opus
# through the libopus adapter (MIT OR Apache-2.0) with bundled libopus
# (opusic-sys, BSD-3-Clause; needs CMake and a C compiler). Output through
# cpal (Apache-2.0; on Linux alsa 0.11, MIT OR Apache-2.0, and alsa-sys,
# MIT, which links the system libasound). rodio is not used: its mixer and
# resampler are more than one player needs. Licences checked from the
# sources on 2026-11-17. Exact pins: bump together after the gv-media audio
# tests pass.
symphonia = { version = "=0.6.1", default-features = false, features = [
  "mp3",
  "aac",
  "alac",
  "flac",
  "vorbis",
  "pcm",
  "isomp4",
  "ogg",
  "mkv",
  "wav",
  "id3v1",
  "id3v2",
  "ape",
] }
symphonia-adapter-libopus = { version = "=0.3.0", default-features = false, features = ["bundled"] }
cpal = { version = "=0.18.2", default-features = false }
# Remote images (gv-media `remote`): a blocking HTTP client over rustls with
# the `ring` provider, verifying through the OS certificate store
# (rustls-platform-verifier), so the Mozilla root list (webpki-roots,
# CDLA-Permissive-2.0) stays out of the graph. No cookies feature. Exact pin:
# the private-address guard implements ureq's `unversioned` resolver trait.
# All MIT OR Apache-2.0 (ring: Apache-2.0 AND ISC).
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Image dimensions (gv-export: the PDF pre-flight), the version usvg already
# pulls in (MIT).
imagesize = "0.14.0"
# PDF export (gv-helper, the `glyphvane-helper` executable only): Typst as
# a library over generated source (Apache-2.0; typst-pdf writes through
# krilla, MIT OR Apache-2.0). Without typst-assets' bundled fonts: fonts
# come from the system through fontdb. 0.x with breaking minors: exact
# pins, bump the three together after the gv-helper PDF tests pass.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
# The helper's IPC frames (MIT OR Apache-2.0).
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# gv-helper tests: reading the exported PDFs back (MIT). Without its default
# features (chrono, rayon).
lopdf = { version = "=0.47.0", default-features = false }
# Print (gv-app, Linux): the xdg-desktop-portal Print interface, through the
# ashpd line GPUI already uses (MIT), on the async-io runtime GPUI uses.
ashpd = { version = "0.13.13", default-features = false, features = [
  "async-io",
  "print",
  "raw_handle",
  "wayland",
] }
# Print (gv-app, macOS): PDFKit's print operation, shown by AppKit as a
# sheet on the window. The objc2 lines GPUI already uses (objc2 MIT, the
# framework crates Zlib OR Apache-2.0 OR MIT; checked 2026-11-17).
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSData",
  "NSObject",
  "NSString",
] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "PDFDocument",
  "objc2-app-kit",
] }
# Print (gv-app, Windows): the common print dialog, Windows.Data.Pdf and a
# Direct2D print control; the windows line GPUI already uses (MIT OR
# Apache-2.0; checked 2026-11-17).
windows = { version = "0.62.2", features = [
  "Data_Pdf",
  "Foundation",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Imaging_D2D",
  "Win32_Graphics_Printing_PrintTicket",
  "Win32_Storage_Xps_Printing",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_WinRT_Pdf",
  "Win32_UI_Controls_Dialogs",
] }
# Spell check (gv-spell): spellbook, a pure-Rust Hunspell-compatible
# checker (MPL-2.0; one maintainer, alpha). Exact pin: bump only after the
# spell-check accuracy harness passes on the new version.
spellbook = "=0.4.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Local timing runs (latency log, start-up trace, wall-clock benches):
# release optimisation without LTO and with parallel code generation, so it
# builds several times faster. Good for before/after comparisons on one
# machine; budget numbers of record come from `release` or `dist`.
[profile.measure]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Release artifacts (`cargo xtask package`, .github/workflows/release.yml).
# Fat LTO is about 6 % smaller than thin LTO but adds minutes to the link, so
# day-to-day release builds keep the thin-LTO profile above.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
strip = "symbols"

# The Mermaid engine's crates are built for size (about 6 MB smaller for
# +15 % diagram render time, which runs off the UI thread). Keep GPUI, text
# shaping, math and image decoding at opt-level 3. Cargo warns about package
# specs that match nothing: drop an entry when its crate leaves the tree.
[profile.dist.package.merman]
opt-level = "s"
[profile.dist.package.merman-core]
opt-level = "s"
[profile.dist.package.merman-render]
opt-level = "s"
[profile.dist.package.merman-model]
opt-level = "s"
[profile.dist.package.merman-markup]
opt-level = "s"
[profile.dist.package.merman-export]
opt-level = "s"
[profile.dist.package.merman-theme-contract]
opt-level = "s"
[profile.dist.package.merman-unicode-linebreak]
opt-level = "s"
[profile.dist.package.roughr-merman]
opt-level = "s"
[profile.dist.package.dugong]
opt-level = "s"
[profile.dist.package.dugong-graphlib]
opt-level = "s"
[profile.dist.package.manatee]
opt-level = "s"

[profile.dev.package."*"]
opt-level = 1

# Patched upstream crates (ADR-014; third_party/zed/PROVENANCE.md). Each is a
# verbatim copy of the published version with a small, upstreamable fix, so
# the version here must equal the one in Cargo.lock.
[patch.crates-io]
# GPUI's Linux text system: variable fonts at the requested weight, and
# application fonts that replace installed fonts of the same name (R-22).
gpui-pre-wgpu = { path = "third_party/zed/gpui-pre-wgpu" }
