# cargo-deny configuration (schema of cargo-deny 0.20).
# Run with: cargo deny check
#
# Dependency policy (NFR-LIC-02). Any exception to this file requires an ADR.

[graph]
# Check every feature combination, not only the default one.
all-features = true
# The targets Glyphvane ships for (Linux and Windows on x86-64 and ARM64,
# macOS on both). Dependencies that only exist for other targets never end
# up in a release, e.g. rustls-platform-verifier's wasm32-only
# webpki-root-certs (CDLA-Permissive-2.0, not on the allow list below).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
[advisories]
# Vulnerability advisories always fail the check (not configurable in 0.20).
#
# Unmaintained advisories: cargo-deny 0.20 has no warn level for these, only a
# scope. "workspace" fails only when one of our crates depends *directly* on an
# unmaintained crate; unmaintained crates deeper in the tree (common under
# GPUI) are not reported. Use `cargo deny check -W unmaintained` to see them
# as warnings across the whole graph.
unmaintained = "workspace"
# Unsound advisories for direct dependencies fail the check.
unsound = "workspace"
# Yanked crate versions are a warning.
yanked = "warn"
# Ignored advisories need a reason and an ADR reference.
#
# quick-xml 0.38.4 via typst -> hayagriva -> citationberg 0.7.0 (newest, pins
# quick-xml 0.38, no fixed release). The affected code parses bibliography
# (CSL) styles, which generated PDFs never use, and it is linked only into
# the sandboxed glyphvane-helper. Accepted in ADR-018 (amendment of
# 2026-11-16); remove when citationberg moves to a fixed quick-xml.
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "CSL parsing unused; helper-only; no fixed version (ADR-018)" },
  { id = "RUSTSEC-2026-0195", reason = "CSL parsing unused; helper-only; no fixed version (ADR-018)" },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (not a vulnerability); required by GPUI and trash, used here for local dates only" },
]

# ---------------------------------------------------------------------------
[licenses]
# Only licenses compatible with distributing Glyphvane under
# GPL-3.0-or-later. Everything not listed is denied, including (by omission):
#   - EPL-2.0 (accepted only via an SPDX expression that offers a listed
#     license as an alternative, e.g. "EPL-2.0 OR GPL-2.0-or-later")
#   - AGPL-3.0 (any variant), SSPL-1.0
#   - non-commercial licenses (e.g. CC-BY-NC-*, PolyForm-Noncommercial)
#   - unknown or unparseable licenses
# Exceptions (the `exceptions` list below) require an ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Unicode data tables bundled in regex-syntax (listed in the notices).
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "Unlicense",
    "BSL-1.0",
    # Fonts only.
    "OFL-1.1",
]
confidence-threshold = 0.93
# Per-crate exceptions; each entry needs an ADR reference in a comment.
exceptions = [
    #{ allow = ["EPL-2.0"], crate = "example" },  # ADR-NNN
    # ADR-016: the code highlighter. EUPL-1.2 is copyleft and not on the
    # allow list; it is accepted for this crate only, through the EUPL's
    # compatibility clause (Art. 5 and the Appendix list GPL-3.0), so the
    # combined work ships under GPL-3.0-or-later. Changes to giallo itself
    # stay EUPL-1.2. The notices (packaging/THIRD-PARTY-NOTICES.txt) carry
    # the EUPL-1.2 text.
    { allow = ["EUPL-1.2"], crate = "giallo" },
]
# Not every allowed license is in use yet.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are unpublished (publish = false) and GPL-3.0-or-later;
# they are not subject to this check.
ignore = true

# ---------------------------------------------------------------------------
[bans]
# GPUI pulls in many duplicate versions; report them but do not fail.
multiple-versions = "warn"
# Version requirements of `*` are denied...
wildcards = "deny"
# ...except for path dependencies inside this workspace.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
[sources]
# Only crates.io by default.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git sources. If ADR-013 selects the Zed git pin for GPUI, the Zed
# repository URL is added here (and only here).
allow-git = []
