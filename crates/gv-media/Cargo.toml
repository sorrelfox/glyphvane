[package]
name = "gv-media"
description = "Image and SVG probing, decoding, orientation, colour and resizing, with caps and a cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# TIFF (first page). Optional per ADR-019 (+0.33 MB); off until the
# full-link size budget is settled.
tiff = ["image/tiff"]
# Remote images: the HTTP fetcher and its disk cache. Off for the helper
# process, which never touches the network.
remote = ["dep:ureq", "dep:rustls", "dep:url"]
# Audio playback: decoding (symphonia, libopus) and the output stream
# (cpal; on Linux it links the system ALSA library). Only the GUI turns it
# on: the CLI and the helper never play sound.
audio = ["dep:symphonia", "dep:symphonia-adapter-libopus", "dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }
fast_image_resize = { workspace = true }
image = { workspace = true }
log = { workspace = true }
miniz_oxide = { workspace = true }
moxcms = { workspace = true }
resvg = { workspace = true }
rustls = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
symphonia-adapter-libopus = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
crc32fast = { workspace = true }
ratex-katex-fonts = { workspace = true }
png = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[test]]
name = "remote"
required-features = ["remote"]

[[test]]
name = "audio"
required-features = ["audio"]
