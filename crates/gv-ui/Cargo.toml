[package]
name = "gv-ui"
description = "GPUI views: workspace, panes, editor and reader elements, panels, theming."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The local time zone's offset for the Bases view's dates (MIT OR
# Apache-2.0; 0.4.45 is already in the graph through GPUI, checked
# 2026-11-17).
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
# gemoji shortcodes for the editor's `:` autocomplete ((MIT OR Apache-2.0)
# AND Unicode-3.0; its phf 0.13.1 is already in the graph, checked
# 2026-11-17).
emojis = "=0.9.1"
fontdb = { workspace = true }
futures = { workspace = true }
gpui = { workspace = true }
gv-bases = { workspace = true }
gv-canvas = { workspace = true }
gv-diagram = { workspace = true }
gv-editor = { workspace = true }
gv-export = { workspace = true }
gv-highlight = { workspace = true }
gv-html = { workspace = true }
gv-inline = { workspace = true }
gv-math = { workspace = true }
# `audio`: the audio embed's player (symphonia, libopus, cpal; links the
# system ALSA library on Linux).
gv-media = { workspace = true, features = ["remote", "audio"] }
gv-model = { workspace = true }
gv-profile = { workspace = true }
gv-render-tree = { workspace = true }
gv-search = { workspace = true }
gv-settings = { workspace = true }
gv-spell = { workspace = true }
gv-syntax = { workspace = true }
gv-text = { workspace = true }
gv-vault = { workspace = true }
# GPUI's animation frames (`image::Frame`), from decoded media.
image = { workspace = true }
nucleo-matcher = { workspace = true }
regex = { workspace = true }
# The update check (FR-PLAT-07): the same HTTP client, TLS set-up and OS
# certificate store as remote images (workspace pins; MIT OR Apache-2.0,
# ring Apache-2.0 AND ISC), and the release JSON (MIT OR Apache-2.0).
rustls = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
notify-debouncer-full = { workspace = true }
# The diagram font when no system sans-serif face is usable (OFL).
ratex-katex-fonts = { workspace = true }
serde = { workspace = true }
sum_tree = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
gpui-pre = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
