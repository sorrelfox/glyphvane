[package]
name = "gv-app"
description = "Native Markdown editor and viewer with precise link navigation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "glyphvane"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
arboard = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
gpui = { workspace = true }
gv-profile = { workspace = true }
gv-settings = { workspace = true }
gv-syntax = { workspace = true }
gv-text = { workspace = true }
gv-ui = { workspace = true }
notify-debouncer-full = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `time` and `param` for the start-up trace's clocks.
rustix = { workspace = true, features = ["param", "time"] }

# The latency log's presentation feedback (`wp_presentation`), on GPUI's own
# Wayland connection: the versions GPUI already uses.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
raw-window-handle = { workspace = true }
wayland-backend = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }

# The clipboard through Wayland's data-control protocol (ext or wlr); without
# it, or where the compositor lacks it, arboard uses X11 (XWayland).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

# Colour emoji (Linux): finding the installed emoji font and checking that
# GPUI's rasterizer can draw it, else the bundled one is added.
[target.'cfg(target_os = "linux")'.dependencies]
fontdb = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { workspace = true }

[dev-dependencies]
gpui-pre = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true

# Linux packages, built by `cargo xtask package --format deb|rpm` (cargo-deb
# =3.8.0, cargo-generate-rpm =0.21.1). `target/release/` is replaced by the
# real target directory and profile (`--target`, `--profile dist`). Paths are
# relative to this crate for cargo-deb and to the workspace root for
# cargo-generate-rpm. The `with-helper` variants add `glyphvane-helper` in
# /usr/libexec/glyphvane/; xtask selects them when that binary is built.
# The colour emoji font in /usr/share/glyphvane/fonts/ is added by the app
# only when the installed one cannot be drawn (src/emoji_font.rs).
[package.metadata.deb]
name = "glyphvane"
maintainer = "sorrelfox <348316453+sorrelfox@users.noreply.github.com>"
copyright = "2026 Glyphvane contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Glyphvane is a native Markdown viewer and editor for notes and vaults."""
section = "editors"
priority = "optional"
# $auto runs dpkg-shlibdeps (off Debian, `cargo xtask package` supplies an
# answer computed from the ELF headers). cargo-deb drops libgcc from $auto, so
# it is listed here. GPUI loads Wayland, EGL and Vulkan with dlopen(), so those
# libraries are listed by hand too.
depends = "$auto, libgcc-s1, libwayland-client0, libwayland-egl1, libvulkan1"
recommends = "libegl1, mesa-vulkan-drivers"
assets = [
  ["target/release/glyphvane", "usr/bin/", "755"],
  ["../../packaging/linux/io.github.sorrelfox.Glyphvane.desktop", "usr/share/applications/", "644"],
  ["../../packaging/linux/io.github.sorrelfox.Glyphvane.metainfo.xml", "usr/share/metainfo/", "644"],
  ["../../packaging/icons/glyphvane.svg", "usr/share/icons/hicolor/scalable/apps/io.github.sorrelfox.Glyphvane.svg", "644"],
  ["../../packaging/icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/io.github.sorrelfox.Glyphvane.png", "644"],
  ["../../packaging/icons/256x256.png", "usr/share/icons/hicolor/256x256/apps/io.github.sorrelfox.Glyphvane.png", "644"],
  ["../../packaging/icons/512x512.png", "usr/share/icons/hicolor/512x512/apps/io.github.sorrelfox.Glyphvane.png", "644"],
  ["../../packaging/THIRD-PARTY-NOTICES.txt", "usr/share/doc/glyphvane/", "644"],
  ["../../third_party/noto-emoji/NotoColorEmoji.ttf", "usr/share/glyphvane/fonts/", "644"],
  ["../../third_party/noto-emoji/LICENSE", "usr/share/glyphvane/fonts/NotoColorEmoji-OFL.txt", "644"],
]

[package.metadata.deb.variants.with-helper]
name = "glyphvane"
merge-assets.append = [
  ["target/release/glyphvane-helper", "usr/libexec/glyphvane/", "755"],
]

[package.metadata.generate-rpm]
name = "glyphvane"
summary = "Native Markdown viewer and editor"
license = "GPL-3.0-or-later"
url = "https://github.com/sorrelfox/glyphvane"
# cargo-generate-rpm 0.21 has no %license flag; the licence is marked %doc.
assets = [
  { source = "target/release/glyphvane", dest = "/usr/bin/glyphvane", mode = "755" },
  { source = "packaging/linux/io.github.sorrelfox.Glyphvane.desktop", dest = "/usr/share/applications/io.github.sorrelfox.Glyphvane.desktop", mode = "644" },
  { source = "packaging/linux/io.github.sorrelfox.Glyphvane.metainfo.xml", dest = "/usr/share/metainfo/io.github.sorrelfox.Glyphvane.metainfo.xml", mode = "644" },
  { source = "packaging/icons/glyphvane.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.sorrelfox.Glyphvane.svg", mode = "644" },
  { source = "packaging/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.sorrelfox.Glyphvane.png", mode = "644" },
  { source = "packaging/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.sorrelfox.Glyphvane.png", mode = "644" },
  { source = "packaging/icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.sorrelfox.Glyphvane.png", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/glyphvane/LICENSE", mode = "644", doc = true },
  { source = "packaging/THIRD-PARTY-NOTICES.txt", dest = "/usr/share/doc/glyphvane/THIRD-PARTY-NOTICES.txt", mode = "644", doc = true },
  { source = "third_party/noto-emoji/NotoColorEmoji.ttf", dest = "/usr/share/glyphvane/fonts/NotoColorEmoji.ttf", mode = "644" },
  { source = "third_party/noto-emoji/LICENSE", dest = "/usr/share/glyphvane/fonts/NotoColorEmoji-OFL.txt", mode = "644" },
]

[package.metadata.generate-rpm.requires]
# Not found by auto-req because GPUI loads them with dlopen().
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libvulkan.so.1()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
"libEGL.so.1()(64bit)" = "*"

# A variant replaces the whole asset list, so this repeats the list above plus
# the helper. Keep the two in sync.
[package.metadata.generate-rpm.variants.with-helper]
assets = [
  { source = "target/release/glyphvane", dest = "/usr/bin/glyphvane", mode = "755" },
  { source = "target/release/glyphvane-helper", dest = "/usr/libexec/glyphvane/glyphvane-helper", mode = "755" },
  { source = "packaging/linux/io.github.sorrelfox.Glyphvane.desktop", dest = "/usr/share/applications/io.github.sorrelfox.Glyphvane.desktop", mode = "644" },
  { source = "packaging/linux/io.github.sorrelfox.Glyphvane.metainfo.xml", dest = "/usr/share/metainfo/io.github.sorrelfox.Glyphvane.metainfo.xml", mode = "644" },
  { source = "packaging/icons/glyphvane.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.sorrelfox.Glyphvane.svg", mode = "644" },
  { source = "packaging/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.sorrelfox.Glyphvane.png", mode = "644" },
  { source = "packaging/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.sorrelfox.Glyphvane.png", mode = "644" },
  { source = "packaging/icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.sorrelfox.Glyphvane.png", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/glyphvane/LICENSE", mode = "644", doc = true },
  { source = "packaging/THIRD-PARTY-NOTICES.txt", dest = "/usr/share/doc/glyphvane/THIRD-PARTY-NOTICES.txt", mode = "644", doc = true },
  { source = "third_party/noto-emoji/NotoColorEmoji.ttf", dest = "/usr/share/glyphvane/fonts/NotoColorEmoji.ttf", mode = "644" },
  { source = "third_party/noto-emoji/LICENSE", dest = "/usr/share/glyphvane/fonts/NotoColorEmoji-OFL.txt", mode = "644" },
]
