[package]
name = "gv-syntax"
description = "Lossless incremental Markdown parser: CST, line checkpoints, profiles, CommonMark HTML emitter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gv-profile.workspace = true
gv-text.workspace = true
memchr.workspace = true
sum_tree.workspace = true

[dev-dependencies]
# Differential oracle and block-structure reference (tests only).
comrak = { workspace = true }
criterion.workspace = true
proptest.workspace = true
serde_json = { workspace = true }
toml = { workspace = true }

# Instruction counts run under Valgrind, on Linux only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun.workspace = true

[[bench]]
name = "parse"
harness = false

# Instruction counts (Valgrind); run with `cargo xtask bench-icount`.
[[bench]]
name = "icount"
harness = false

[lints]
workspace = true
