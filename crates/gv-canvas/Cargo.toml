[package]
name = "gv-canvas"
description = "JSON Canvas 1.0 model that preserves unknown keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
# `preserve_order` keeps object keys in file order, so unknown keys survive a
# round trip in place.
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
