[package]
name = "gv-helper"
description = "Helper-process entry points and IPC protocol for risky or non-cancellable engines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The separate helper executable (ADR-020, layout H2). The GUI depends on
# this crate without the `engine` feature: it gets the protocol and the
# client, and links no Typst.
[[bin]]
name = "glyphvane-helper"
path = "src/main.rs"
required-features = ["engine"]

[features]
default = ["engine"]
# The engines the helper runs: Typst PDF export, PDF page raster.
engine = ["dep:typst", "dep:typst-pdf", "dep:typst-layout", "dep:fontdb", "dep:hayro"]

[dependencies]
postcard = { workspace = true }
serde = { workspace = true }
fontdb = { workspace = true, optional = true }
typst = { workspace = true, optional = true }
typst-layout = { workspace = true, optional = true }
typst-pdf = { workspace = true, optional = true }
# PDF page raster (previews): the version Typst already pulls in through
# typst-svg, without its embedded fallback fonts (MIT OR Apache-2.0).
hayro = { version = "=0.7.1", default-features = false, optional = true }

# The helper's address-space limit.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
fontdb = { workspace = true }
gv-export = { workspace = true }
gv-model = { workspace = true }
gv-profile = { workspace = true }
gv-render-tree = { workspace = true }
gv-syntax = { workspace = true }
lopdf = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
