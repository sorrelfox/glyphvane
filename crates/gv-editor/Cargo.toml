[package]
name = "gv-editor"
description = "Buffer model, selections, transactions, undo, Markdown commands and the display map."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The Markdown commands read the block and inline structure at the carets.
gv-syntax.workspace = true
gv-text.workspace = true
# The wrap layer's transform tree (the crate GPUI uses; GUI-free).
sum_tree.workspace = true
# UAX #14 break opportunities for soft wrap.
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
rand.workspace = true
# `RandomCharIter` for the ported Zed tests (third_party/zed/PROVENANCE.md).
zed-test-util = { workspace = true, features = ["test-support"] }

# Instruction counts run under Valgrind, on Linux only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun.workspace = true

[[bench]]
name = "typing"
harness = false

[[bench]]
name = "wrap"
harness = false

[[bench]]
name = "blocks"
harness = false

# Instruction counts (Valgrind); run with `cargo xtask bench-icount`.
[[bench]]
name = "icount"
harness = false

[lints]
workspace = true
