# Vendored from zed-industries/zed, crates/rope, at commit
# d2a4fb6ded7c470be25d1541281da3882495b65b. GPL-3.0-or-later.
# Sources are unmodified; this manifest is adapted to build inside the
# Glyphvane workspace against published crates. See ../PROVENANCE.md.

[package]
name = "rope"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Upstream: `[lints] workspace = true`. Zed's workspace lint table, copied
# from zed's root Cargo.toml at the same commit, so the code builds without
# warnings under `cargo clippy -- -D warnings`.
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/rope.rs"
doctest = false

[dependencies]
gpui_util.workspace = true
heapless.workspace = true
log.workspace = true
rayon.workspace = true
sum_tree.workspace = true
unicode-segmentation.workspace = true
ztracing.workspace = true
tracing.workspace = true

[dev-dependencies]
ctor.workspace = true
# Upstream: `gpui = { workspace = true, features = ["test-support"] }`. Only the
# `#[gpui::test]` macro is used. Keep this pin equal to the workspace `gpui-pre` pin.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
rand.workspace = true
# Upstream: Zed's `util` and `zlog` crates. Replaced by test-only shims (see PROVENANCE.md).
util = { package = "zed-test-util", path = "../test-shims/util", features = ["test-support"] }
criterion.workspace = true
zlog = { package = "zed-test-zlog", path = "../test-shims/zlog" }

[[bench]]
name = "rope_benchmark"
harness = false

[package.metadata.cargo-shear]
ignored = ["tracing"]
