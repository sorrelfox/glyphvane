name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # GitHub stops a runner that uses more than about 12 GB; one merman rustc
  # alone takes 6-7 GB, so at most two compile jobs run at once.
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  lint:
    name: Lint (fmt, headers, deps, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GPUI system packages. The M0 spike linked only xkbcommon, xkbcommon-x11 and xcb;
      # the rest is Zed's Ubuntu list, kept until the first green run proves it can be trimmed.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev pkg-config

      # rustup reads rust-toolchain.toml (channel and components).
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check SPDX headers
        run: cargo xtask check-headers

      - name: Check core crates stay GUI-free
        run: cargo xtask check-deps

      # Spec fixtures match their recorded SHA-256 sums (offline), and no
      # example listed in tests/fixtures/spec/passing*.txt has regressed.
      - name: Spec conformance ratchet
        run: |
          cargo xtask fetch-spec --verify --offline
          cargo xtask spec --suite commonmark --ratchet --diffs 0
          cargo xtask spec --suite gfm --ratchet --diffs 0

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GPUI system packages. The M0 spike linked only xkbcommon, xkbcommon-x11 and xcb;
      # the rest is Zed's Ubuntu list, kept until the first green run proves it can be trimmed.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev pkg-config

      # rustup reads rust-toolchain.toml (channel and components).
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

  # NFR-SIZE: both executables in the release profile, against their budgets
  # and against the last successful run on the base branch. More than 3 %
  # growth fails unless the pull request carries the `binary-size-justified`
  # label (re-run the job after adding it).
  binary-size:
    name: Binary size
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Download the base branch's report and read the pull request's labels.
      actions: read
      pull-requests: read
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: dist

      # Both executables, as the release builds them.
      - name: Build (dist profile)
        run: cargo build --locked --profile dist -p gv-app -p gv-helper

      - name: Fetch the base branch's size report
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch "$GITHUB_BASE_REF" --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name binary-size --dir baseline \
              || echo "No size report in run $run_id"
          fi
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if printf '%s\n' "$labels" | grep -qx binary-size-justified; then
            echo "ALLOW_GROWTH=1" >> "$GITHUB_ENV"
          fi

      - name: Size report
        run: |
          args=(--bin-dir target/dist --json binary-size.json)
          if [ -f baseline/binary-size.json ]; then args+=(--baseline baseline/binary-size.json); fi
          if [ -n "${ALLOW_GROWTH:-}" ]; then args+=(--allow-growth); fi
          cargo xtask size-report "${args[@]}"

      # TODO: add a per-crate breakdown (cargo-bloat) to explain growth.

      - name: Keep the report as the baseline for pull requests
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: binary-size
          path: binary-size.json
          retention-days: 90

  # NFR-PERF gate: instruction counts of the parser benchmarks (full parse,
  # keystroke reparse, fence at the top) under Valgrind, with gungraun. A pull
  # request is measured against its base commit in the same job, so both runs
  # share the machine, toolchain and Valgrind. More than 3 % growth in any
  # benchmark fails unless the pull request carries the
  # `perf-regression-justified` label (re-run the job after adding it).
  icount:
    name: Instruction counts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Read the pull request's labels.
      pull-requests: read
    env:
      # Shared by the base and head runs: dependencies build once, and the
      # head run finds the base run's baseline.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GUNGRAUN_HOME: ${{ github.workspace }}/target/gungraun
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: icount

      # After the cache step, so the base's Cargo.lock does not change the cache key.
      - name: Check out the base commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # The runner must be the version of the `gungraun` library in Cargo.lock.
      - name: Install gungraun-runner
        run: |
          version=$(grep -A1 '^name = "gungraun"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "GUNGRAUN_VERSION=$version" >> "$GITHUB_ENV"
          cargo install gungraun-runner --version "$version" --locked

      - name: Baseline from the base commit
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base_version=$(grep -A1 '^name = "gungraun"$' base/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p' || true)
          if [ ! -f base/crates/gv-syntax/benches/icount.rs ]; then
            echo "::notice::The base commit has no instruction-count benches; nothing to compare."
          elif [ "$base_version" != "$GUNGRAUN_VERSION" ]; then
            echo "::notice::gungraun changed ($base_version -> $GUNGRAUN_VERSION); nothing to compare."
          else
            # The base commit may pin another toolchain.
            (cd base && rustup toolchain install && cargo xtask bench-icount --save-baseline base)
            echo "HAVE_BASELINE=1" >> "$GITHUB_ENV"
            # The base runs its own bench list. A bench it does not have gets
            # no baseline: gungraun reports it without a comparison.
            for bench in crates/*/benches/icount.rs; do
              if [ ! -f "base/$bench" ]; then
                echo "::notice::The base commit has no $bench; its counts are reported, not compared."
              fi
            done
          fi
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if printf '%s\n' "$labels" | grep -qx perf-regression-justified; then
            echo "ALLOW_REGRESSION=1" >> "$GITHUB_ENV"
          fi

      - name: Instruction counts
        shell: bash
        run: |
          args=()
          if [ -n "${HAVE_BASELINE:-}" ]; then args+=(--baseline base); fi
          if [ -n "${ALLOW_REGRESSION:-}" ]; then args+=(--allow-regression); fi
          status=0
          cargo xtask bench-icount "${args[@]}" 2>&1 | tee icount.txt || status=$?
          {
            echo '### Instruction counts'
            echo '```'
            grep -E '^[a-z_]+::|Instructions:|regressed|exceeds limit|Gungraun result' icount.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `check` runs advisories, bans, licenses and sources against deny.toml.
      # The advisories check uses the RustSec database, so it covers what
      # cargo-audit would report.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  docs-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Offline mode: checks relative links and anchors between repository
      # files; remote URLs are skipped so the job does not flake on the network.
      # The sample vault uses Obsidian wikilinks and embeds, which are not
      # Markdown links; Glyphvane's own link checker covers it.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --exclude-path target
            --exclude-path '(^|/)tests/'
            --exclude-path '(^|/)fuzz/'
            --exclude-path 'docs/sample-vault/'
            './**/*.md'
          fail: true
