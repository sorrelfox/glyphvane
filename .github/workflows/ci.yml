name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  lint:
    name: Lint (fmt, headers, deps, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GPUI system packages. The M0 spike linked only xkbcommon, xkbcommon-x11 and xcb;
      # the rest is Zed's Ubuntu list, kept until the first green run proves it can be trimmed.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev pkg-config

      # rustup reads rust-toolchain.toml (channel and components).
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check SPDX headers
        run: cargo xtask check-headers

      - name: Check core crates stay GUI-free
        run: cargo xtask check-deps

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GPUI system packages. The M0 spike linked only xkbcommon, xkbcommon-x11 and xcb;
      # the rest is Zed's Ubuntu list, kept until the first green run proves it can be trimmed.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev pkg-config

      # rustup reads rust-toolchain.toml (channel and components).
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `check` runs advisories, bans, licenses and sources against deny.toml.
      # The advisories check uses the RustSec database, so it covers what
      # cargo-audit would report.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  docs-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Offline mode: checks relative links and anchors between repository
      # files; remote URLs are skipped so the job does not flake on the network.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --exclude-path target
            './**/*.md'
          fail: true
