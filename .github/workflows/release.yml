# Copyright (C) 2026 Glyphvane contributors

# Release pipeline: build every target with [profile.dist], package with one
# pinned tool per format (`cargo xtask package`), sign (Windows: SignPath
# when configured), then checksums, build-provenance
# attestations, an SBOM, and a draft GitHub Release.
#
# Secrets and variables (all optional; without them Windows builds ship
# unsigned):
#   secrets.SIGNPATH_API_TOKEN       SignPath API token (environment `release`)
#   vars.SIGNPATH_ORGANIZATION_ID    SignPath organization id
# Linux and Windows only: there are no macOS builds.

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Jobs opt in to what they need.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # GitHub stops a runner that uses more than about 12 GB; one merman rustc
  # alone takes 6-7 GB, so at most two compile jobs run at once.
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Pinned packaging tools (ADR-020). Keep in step with xtask/src/package/.
  CARGO_DEB_VERSION: "3.8.0"
  CARGO_GENERATE_RPM_VERSION: "0.21.1"
  CARGO_CYCLONEDX_VERSION: "0.5.10"
  WIX_VERSION: "6.0.2"
  APPIMAGE_RUNTIME_RELEASE: "20251108"

# Release builds do not use caches: a cache written by a pull request run must
# not reach a release artifact.

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag matches the workspace version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 sets the glibc 2.35 floor of the support matrix.
          - arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            runtime-sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            runtime-sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # The full GUI build needs about 8 GB per job at the peak (one rustc
      # for the diagram engine plus GPUI's large crates); 3 jobs fit 16 GB.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev pkg-config \
            build-essential cmake \
            dpkg-dev squashfs-tools zsync

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install packaging tools
        run: |
          cargo install --locked "cargo-deb@$CARGO_DEB_VERSION"
          cargo install --locked "cargo-generate-rpm@$CARGO_GENERATE_RPM_VERSION"

      # Data only: xtask checks the SHA-256 and prepends it to the image; it
      # is never executed while packaging.
      - name: Download the AppImage runtime
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_RELEASE/runtime-${{ matrix.arch }}"
          echo "${{ matrix.runtime-sha256 }}  $RUNNER_TEMP/runtime" | sha256sum -c -

      - name: Set SOURCE_DATE_EPOCH to the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # Both executables: `xtask package --no-build` packages glyphvane-helper
      # (and the PDF fonts) whenever gv-helper has its binary.
      - name: Build
        run: cargo build --locked --profile dist --target ${{ matrix.target }} -p gv-app -p gv-helper

      - name: Check the glibc floor (2.35)
        run: |
          for exe in glyphvane glyphvane-helper; do
            newest=$(objdump -T "target/${{ matrix.target }}/dist/$exe" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$exe: newest glibc symbol version: $newest"
            [ "$(printf '%s\n' "$newest" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ]
          done

      - name: Package
        run: >-
          cargo xtask package --no-build
          --target ${{ matrix.target }}
          --format deb,rpm,tar.gz,appimage
          --appimage-runtime "$RUNNER_TEMP/runtime"
          --out dist

      - name: AppImage update file (zsync)
        working-directory: dist
        run: |
          for f in *.AppImage; do
            touch -d "@$SOURCE_DATE_EPOCH" "$f"
            zsyncmake -u "$f" -o "$f.zsync" "$f"
          done

      - name: Smoke test (deb, tarball, AppImage, rpm)
        run: |
          sudo apt-get install -y ./dist/glyphvane_*.deb
          glyphvane --version
          printf '# Smoke test\n' | glyphvane render - | grep -q '<h1>Smoke test</h1>'
          # PDF export runs glyphvane-helper with the bundled fonts.
          printf '# Smoke test\n\nSome *text* and `code`.\n' > "$RUNNER_TEMP/smoke.md"
          glyphvane export --pdf "$RUNNER_TEMP/smoke.md" -o "$RUNNER_TEMP/deb.pdf"
          head -c 5 "$RUNNER_TEMP/deb.pdf" | grep -q '%PDF-'
          mkdir -p "$RUNNER_TEMP/tarball"
          tar -xzf dist/glyphvane-*.tar.gz -C "$RUNNER_TEMP/tarball"
          "$RUNNER_TEMP"/tarball/glyphvane-*/glyphvane --version
          "$RUNNER_TEMP"/tarball/glyphvane-*/glyphvane export --pdf "$RUNNER_TEMP/smoke.md" -o "$RUNNER_TEMP/tarball.pdf"
          head -c 5 "$RUNNER_TEMP/tarball.pdf" | grep -q '%PDF-'
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Glyphvane-*.AppImage --version
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest \
            sh -c 'dnf install -y /dist/glyphvane-*.rpm >/dev/null && glyphvane --version'

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/*
            !dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    # The SignPath token is an environment secret with required reviewers.
    environment: release
    permissions:
      contents: read
      # SignPath reads the uploaded workflow artifact through the API.
      actions: read
    env:
      CARGO_BUILD_JOBS: 2
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      # WiX v6 is under the Open Source Maintenance Fee EULA (Q-22). If it is
      # not accepted, NSIS (makensis) is the documented alternative.
      - name: Install WiX Toolset
        run: |
          # .NET global tools live in %USERPROFILE%\.dotnet\tools.
          tools="$HOME/.dotnet/tools"
          export PATH="$tools:$PATH"
          cygpath -w "$tools" >> "$GITHUB_PATH"
          dotnet tool install --global wix --version "$WIX_VERSION"
          wix --version
          wix extension add --global "WixToolset.UI.wixext/$WIX_VERSION"

      - name: Set SOURCE_DATE_EPOCH to the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # Both executables: `xtask package --no-build` packages glyphvane-helper
      # (and the PDF fonts) whenever gv-helper has its binary.
      - name: Build
        run: cargo build --locked --profile dist --target ${{ matrix.target }} -p gv-app -p gv-helper

      # SignPath signs the executables before they are packaged, then the MSI.
      - name: Upload the executables for signing
        id: unsigned-exes
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-exes-${{ matrix.arch }}
          path: target/${{ matrix.target }}/dist/glyphvane*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the executables (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: glyphvane
          signing-policy-slug: release-signing
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.unsigned-exes.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/${{ matrix.target }}/dist

      - name: Package
        run: >-
          cargo xtask package --no-build
          --target ${{ matrix.target }}
          --format zip,msi
          --out dist

      - name: Upload the MSI for signing
        id: unsigned-msi
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-msi-${{ matrix.arch }}
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 1

      - name: Sign the MSI (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: glyphvane
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Smoke test
        run: |
          target/${{ matrix.target }}/dist/glyphvane.exe --version
          printf '# Smoke test\n' | target/${{ matrix.target }}/dist/glyphvane.exe render - | grep -q '<h1>Smoke test</h1>'
          if [ "$SIGNPATH_ENABLED" = true ]; then
            powershell -NoProfile -Command "Get-AuthenticodeSignature dist/*.msi, target/${{ matrix.target }}/dist/*.exe | Format-Table -AutoSize"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist/*
            !dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # Repackages the Linux job's tarball (no compiling) into a Flatpak bundle
  # on the freedesktop runtime: packaging/flatpak/.
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: [check, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      APP_ID: io.github.sorrelfox.Glyphvane
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-linux-${{ matrix.arch }}
          path: linux

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder appstream desktop-file-utils dbus-daemon
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Set SOURCE_DATE_EPOCH to the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # flatpak-builder installs the runtime and SDK from Flathub.
      - name: Build
        run: |
          cp "linux/glyphvane-$VERSION-${{ matrix.target }}.tar.gz" packaging/flatpak/glyphvane.tar.gz
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo="$RUNNER_TEMP/repo" "$RUNNER_TEMP/build-dir" \
            "packaging/flatpak/$APP_ID.yml"

      - name: Check the metadata
        run: |
          files="$RUNNER_TEMP/build-dir/files"
          appstreamcli validate --no-net --explain "$files/share/metainfo/$APP_ID.metainfo.xml"
          desktop-file-validate "$files/share/applications/$APP_ID.desktop"

      - name: Bundle
        run: |
          mkdir -p dist
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/repo" "dist/Glyphvane-$VERSION-${{ matrix.arch }}.flatpak" "$APP_ID"

      - name: Smoke test
        run: |
          flatpak install --user -y --noninteractive "dist/Glyphvane-$VERSION-${{ matrix.arch }}.flatpak"
          dbus-run-session -- flatpak run "$APP_ID" --version | tee "$RUNNER_TEMP/version"
          grep -q "$VERSION" "$RUNNER_TEMP/version"
          # PDF export runs the helper from /app/libexec with the bundled fonts.
          printf '# Smoke test\n\nSome *text* and `code`.\n' > "$RUNNER_TEMP/smoke.md"
          dbus-run-session -- flatpak run "$APP_ID" export --pdf "$RUNNER_TEMP/smoke.md" -o "$RUNNER_TEMP/flatpak.pdf"
          head -c 5 "$RUNNER_TEMP/flatpak.pdf" | grep -q '%PDF-'

      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error
          retention-days: 7

  # Repackages the Linux job's tarball (no compiling) with makepkg in an
  # Arch Linux container: packaging/arch/PKGBUILD. x86_64 only, since Arch
  # Linux ARM is a separate, unofficial port.
  arch:
    name: Arch Linux (x86_64)
    needs: [check, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-linux-x86_64
          path: linux

      - name: Set SOURCE_DATE_EPOCH to the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # makepkg finds the tarball next to the PKGBUILD and does not download
      # it; pkgver and the checksum are set for this release.
      - name: Build (makepkg)
        run: |
          tarball="glyphvane-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/arch" dist
          cp packaging/arch/PKGBUILD "linux/$tarball" "$RUNNER_TEMP/arch/"
          sum=$(sha256sum "linux/$tarball" | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$sum')/" "$RUNNER_TEMP/arch/PKGBUILD"
          docker run --rm -e SOURCE_DATE_EPOCH -v "$RUNNER_TEMP/arch:/build" archlinux:base-devel \
            bash -euo pipefail -c '
              useradd -m builder
              chown -R builder /build
              su builder -c "cd /build && makepkg --nodeps --noconfirm"
              chmod -R a+rX /build'
          cp "$RUNNER_TEMP/arch/glyphvane-bin-$VERSION-1-x86_64.pkg.tar.zst" \
            "dist/glyphvane-$VERSION-1-x86_64.pkg.tar.zst"

      - name: Smoke test (pacman -U)
        run: |
          docker run --rm -e VERSION -v "$PWD/dist:/dist:ro" archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm >/dev/null
              pacman -U --noconfirm /dist/glyphvane-*.pkg.tar.zst >/dev/null
              glyphvane --version | grep -q "$VERSION"
              printf "# Smoke test\n" | glyphvane render - | grep -q "<h1>Smoke test</h1>"
              # PDF export runs the helper from /usr/lib/glyphvane.
              printf "# Smoke test\n\nSome *text* and \`code\`.\n" > /tmp/smoke.md
              glyphvane export --pdf /tmp/smoke.md -o /tmp/arch.pdf
              head -c 5 /tmp/arch.pdf | grep -q "%PDF-"'

      - uses: actions/upload-artifact@v7
        with:
          name: release-arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Checksums, attestations, SBOM, draft release
    needs: [check, linux, windows, flatpak, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The workspace is needed for the SBOM.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Install Rust toolchain
        run: rustup toolchain install

      # One SBOM per executable, covering the dependencies of every target
      # platform. The helper's appears once gv-helper builds its binary.
      - name: SBOM (CycloneDX)
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo install --locked "cargo-cyclonedx@$CARGO_CYCLONEDX_VERSION"
          cargo cyclonedx --manifest-path crates/gv-app/Cargo.toml --format json \
            --describe binaries --target all --spec-version 1.5
          mv crates/gv-app/glyphvane_bin.cdx.json dist/glyphvane.cdx.json
          if [ -f crates/gv-helper/glyphvane-helper_bin.cdx.json ]; then
            mv crates/gv-helper/glyphvane-helper_bin.cdx.json dist/glyphvane-helper.cdx.json
          fi

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Build-provenance attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Downloads

          | System | File | Install |
          |---|---|---|
          | Debian, Ubuntu | \`glyphvane_${VERSION}-1_<arch>.deb\` | \`sudo apt install ./glyphvane_${VERSION}-1_<arch>.deb\` |
          | Fedora, openSUSE | \`glyphvane-${VERSION}-1.<arch>.rpm\` | \`sudo dnf install ./glyphvane-${VERSION}-1.<arch>.rpm\` |
          | Arch Linux (x86_64) | \`glyphvane-${VERSION}-1-x86_64.pkg.tar.zst\` | \`sudo pacman -U glyphvane-${VERSION}-1-x86_64.pkg.tar.zst\` |
          | Any Linux (Flatpak) | \`Glyphvane-${VERSION}-<arch>.flatpak\` | \`flatpak install --user Glyphvane-${VERSION}-<arch>.flatpak\` |
          | Any Linux | \`Glyphvane-${VERSION}-<arch>.AppImage\` | make it executable and run it |
          | Any Linux | \`glyphvane-${VERSION}-<target>.tar.gz\` | unpack and run \`glyphvane\` |
          | Windows | \`.msi\` or \`.zip\` (x64, arm64) | run the installer, or unpack the zip |

          ## Verifying the downloads

          \`\`\`sh
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify <file> --repo $GITHUB_REPOSITORY
          \`\`\`

          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "Glyphvane $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
